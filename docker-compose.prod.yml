# Production overlay. Use with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Postgres/Redis/API/extractor stay on the internal Docker network
# (no 5432/6379/3000/8100 on the host). Proxy is only 127.0.0.1:18083.

services:
  postgres:
    restart: always
    ports: !override []

  redis:
    restart: always
    ports: !override []

  api:
    restart: always
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://jobwatch.maselcorp.com.br}
    ports: !override []

  worker:
    restart: always
    environment:
      NODE_ENV: production
      WAREHOUSE_EXTRACTOR_URL: http://warehouse-extractor:8100

  warehouse-extractor:
    restart: always
    ports: !override []

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: jobwatch-frontend
    restart: always

  proxy:
    image: nginx:1.27-alpine
    container_name: jobwatch-proxy
    restart: always
    depends_on:
      - api
      - frontend
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    # Hardcoded localhost:18083 — matches /etc/nginx/sites-enabled/jobwatch.maselcorp.com.br.
    # Not 80/443 (Ubuntu nginx). Not 18080-18082 (Status Energy / Sal Energia).
    ports: !override
      - '127.0.0.1:18083:80'
